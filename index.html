<style>
/* Layout: one phone-width column (wider on desktop), game HUD on top, fixed bottom tab bar, bottom sheets for logging. Dark-first "forge" look. */
:root {
  --bg: #0f1114; --surface: #171a1f; --surface-2: #1f232a; --line: #2b3038; --fg: #edeff2; --muted: #8c94a1;
  --accent: #f2a93b; --accent-ink: #1a1205; --accent-soft: rgba(242,169,59,.14);
  --spirit: #f2c14e; --build: #5aa9e6; --body: #ef6a4c; --stretch: #4fc3a1; --learn: #b08cf2;
  --good: #4fc38a; --bad: #e5534b; --shadow: 0 10px 30px rgba(0,0,0,.35);
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body-font: "Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #eceef1; --surface: #ffffff; --surface-2: #f4f5f7; --line: #d6dae0; --fg: #14171c; --muted: #5b6370;
  --accent: #b46f0c; --accent-ink: #ffffff; --accent-soft: rgba(180,111,12,.12);
  --spirit: #a97c06; --build: #1f6fb2; --body: #c6402a; --stretch: #17876a; --learn: #7246c9;
  --good: #1d8a54; --bad: #c4362f; --shadow: 0 10px 30px rgba(20,23,28,.10); color-scheme: light;
} }
:root[data-theme="light"] {
  --bg: #eceef1; --surface: #ffffff; --surface-2: #f4f5f7; --line: #d6dae0; --fg: #14171c; --muted: #5b6370;
  --accent: #b46f0c; --accent-ink: #ffffff; --accent-soft: rgba(180,111,12,.12);
  --spirit: #a97c06; --build: #1f6fb2; --body: #c6402a; --stretch: #17876a; --learn: #7246c9;
  --good: #1d8a54; --bad: #c4362f; --shadow: 0 10px 30px rgba(20,23,28,.10); color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
img { max-width: 100%; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--fg); font: 16px/1.5 var(--body-font); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, textarea, select { font: inherit; color: inherit; }
input, textarea, select { font-size: 16px; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 620px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.app.wide { max-width: 1040px; }
h1, h2, h3 { font-family: var(--display); text-transform: uppercase; letter-spacing: .02em; line-height: 1; margin: 0; text-wrap: balance; }
h1 { font-size: 34px; font-weight: 900; }
h2 { font-size: 22px; font-weight: 800; }
h3 { font-size: 18px; font-weight: 800; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.tiny { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.spread { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.stack { display: grid; gap: 8px; }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Brand bar */
.brand { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.logo { font-family: var(--display); font-weight: 900; font-size: 22px; text-transform: uppercase; letter-spacing: .03em; display: flex; align-items: center; gap: 6px; }
.logo b { color: var(--accent); font-size: 26px; line-height: 0; }
.logo s { text-decoration: line-through; text-decoration-thickness: 3px; text-decoration-color: var(--accent); color: var(--muted); }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; width: 44px; height: 44px; display: grid; place-items: center; }

/* HUD */
.hud { background: linear-gradient(160deg, var(--surface-2), var(--surface)); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: grid; gap: 14px; position: relative; overflow: hidden; }
.hud::after { content: ""; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, var(--accent-soft), transparent 70%); pointer-events: none; }
.lvl { width: 58px; height: 58px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 30px; flex: none; transform: rotate(-4deg); box-shadow: 0 6px 18px var(--accent-soft); }
.xpbar { height: 12px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--spirit)); border-radius: 99px; transition: width .6s ease; }
.streak { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 14px; white-space: nowrap; }

/* Quests */
.quest { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
.quest.done { border-color: color-mix(in srgb, var(--good) 55%, var(--line)); }
.check { width: 30px; height: 30px; border-radius: 10px; border: 2px solid var(--line); display: grid; place-items: center; flex: none; }
.quest.done .check { background: var(--good); border-color: var(--good); color: var(--bg); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 99px; font-size: 13px; font-weight: 600; background: var(--surface); border: 1px solid var(--line); white-space: nowrap; }
.chip.on { border-color: transparent; background: var(--accent-soft); color: var(--accent); }
.ring { width: 64px; height: 64px; flex: none; }
.ring circle { fill: none; stroke-width: 7; }
.ring .bg { stroke: var(--surface-2); }
.ring .fg { stroke: var(--good); stroke-linecap: round; transition: stroke-dashoffset .6s ease; transform: rotate(-90deg); transform-origin: 50% 50%; }
.ring text { fill: var(--fg); font-family: var(--display); font-weight: 900; font-size: 20px; text-anchor: middle; dominant-baseline: central; }

/* Action pad */
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.act { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px 8px 12px; display: grid; justify-items: center; gap: 6px; font-weight: 700; font-size: 15px; min-height: 92px; position: relative; transition: transform .12s ease; }
.act:active { transform: scale(.96); }
.act .ic { width: 28px; height: 28px; }
.act small { font-family: var(--mono); font-size: 11px; color: var(--muted); font-weight: 500; }
.a-spirit { color: var(--spirit); } .a-build { color: var(--build); } .a-body { color: var(--body); } .a-stretch { color: var(--stretch); } .a-learn { color: var(--learn); }
.act span { color: var(--fg); }

/* Weekly musts */
.must { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; }
.must .badge { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); }
.pips { display: flex; gap: 4px; flex-wrap: wrap; }
.pip { width: 16px; height: 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); }
.pip.on { background: currentColor; border-color: transparent; }
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { text-align: center; display: grid; gap: 4px; justify-items: center; font-size: 12px; color: var(--muted); font-weight: 600; }
.dots { display: flex; gap: 3px; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--line); }
.dot.s { background: var(--spirit); border-color: var(--spirit); }
.dot.b { background: var(--build); border-color: var(--build); }
.dot.miss { border-color: var(--bad); }
.day.today { color: var(--accent); }
.status { padding: 4px 10px; border-radius: 99px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.status.good { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.status.warn { background: var(--accent-soft); color: var(--accent); }
.status.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }

/* Lists */
.list { display: grid; }
.item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); min-width: 0; }
.item:first-child { border-top: 0; padding-top: 2px; }
.item .ic { margin-top: 2px; }
.thumb { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; flex: none; background: var(--surface-2); border: 1px solid var(--line); }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 11px 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
a.btn { text-decoration: none; color: inherit; }
a.btn.primary { color: var(--accent-ink); }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.linkish { background: none; border: 0; padding: 4px; color: var(--muted); font-size: 14px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 14px; font-weight: 600; color: var(--muted); }
.input { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 48px; }
textarea.input { min-height: 84px; resize: vertical; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 99px; padding: 8px 14px; font-weight: 600; min-height: 40px; }
.seg button.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

/* Lock tile */
.locked { background: repeating-linear-gradient(135deg, var(--surface), var(--surface) 10px, var(--surface-2) 10px, var(--surface-2) 20px); }
.lockmeter { display: flex; gap: 6px; }
.lockmeter i { flex: 1; height: 10px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); }
.lockmeter i.on { background: var(--good); border-color: transparent; }
.lockmeter i.trial { border: 1.5px dashed var(--accent); }
.lockmeter i.trial.on { background: var(--accent); border-style: solid; }
.avatar { position: relative; }
.avatar .live { position: absolute; right: -4px; bottom: -4px; width: 13px; height: 13px; border-radius: 50%; background: var(--good); border: 2.5px solid var(--surface); }
.online { color: var(--good); font-weight: 700; }
.pick { display: flex; gap: 8px; }
.pick label { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 700; cursor: pointer; }
.pick input { accent-color: var(--accent-ink); width: 18px; height: 18px; margin: 0; }
.pick label:has(input:checked) { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.pick label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.post { display: grid; gap: 8px; padding: 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); border-left: 4px solid var(--accent); min-width: 0; }
.post.k-prayer { border-left-color: var(--spirit); } .post.k-learned { border-left-color: var(--learn); } .post.k-word { border-left-color: var(--good); }
.bell { position: relative; }
.bell .dot { position: absolute; top: -5px; right: -5px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 800; display: grid; place-items: center; border: 2px solid var(--bg); }
.brand .row { gap: 8px; }
.ann { border: 1.5px solid var(--accent); background: var(--accent-soft); }
.thumb { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); }
.feed .item { align-items: center; }
.feed .item.new b::after { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-left: 6px; vertical-align: middle; }
.post p { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.chip.btnish { cursor: pointer; min-height: 34px; padding: 4px 12px; }
.trialbox { padding: 12px 14px; border-radius: 14px; border: 1.5px dashed var(--accent); background: var(--accent-soft); }

/* Photos */
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.shot { border-radius: 14px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); display: grid; }
.shot img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; max-width: 100%; }
.shot div { padding: 8px 10px; font-size: 13px; }
.preview { width: 100%; max-height: 240px; object-fit: cover; border-radius: 14px; border: 1px solid var(--line); }

/* People */
.avatar { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 20px; flex: none; background: var(--surface-2); border: 1px solid var(--line); text-transform: uppercase; }
.person { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); text-align: left; width: 100%; }
.mini { display: flex; gap: 4px; }
.mini i { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); font-style: normal; }
.mini i .ic { width: 13px; height: 13px; }
.mini i.on { background: currentColor; border-color: transparent; }
.mini i.on .ic { stroke: var(--bg); }
.rank { font-family: var(--display); font-weight: 900; font-size: 22px; width: 26px; text-align: center; color: var(--muted); }
/* Calendar */
.calgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.calh { text-align: center; font-size: 12px; color: var(--muted); font-weight: 700; }
.cell { aspect-ratio: 1 / 1.1; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); display: grid; align-content: space-between; justify-items: center; padding: 6px 2px; font-weight: 700; font-size: 14px; min-width: 0; font-variant-numeric: tabular-nums; }
.cell.out { opacity: .35; }
.cell.today { border-color: var(--accent); color: var(--accent); }
.cell.sel { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.cd { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; min-height: 6px; }
.cd i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.cell.sel .cd i { background: var(--accent-ink); }
.cd i.g { background: var(--muted); }
.tl .item { align-items: center; }
.tl .tm { flex: none; width: 64px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.25; }
.gdot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--muted); }
.tchip { font-size: 12px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; flex: none; }
.daychk { position: relative; display: inline-block; }
.daychk input { position: absolute; opacity: 0; inset: 0; margin: 0; }
.daychk span { display: inline-grid; place-items: center; width: 40px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 700; }
.daychk input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.daychk input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.rt { display: grid; gap: 10px; padding: 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
.rt .row input[type="time"] { width: auto; min-width: 0; }
.cols { display: grid; gap: 14px; }
@media (min-width: 900px) { .cols { grid-template-columns: 380px 1fr; align-items: start; } }

/* Nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.nav-in { max-width: 620px; margin: 0 auto; display: flex; }
.nav a { flex: 1; display: grid; justify-items: center; gap: 2px; padding: 9px 0 8px; color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; min-height: 58px; }
.nav a.on { color: var(--accent); }
.nav a .ic { width: 24px; height: 24px; }

/* Sheet */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease; }
.sheet { width: 100%; max-width: 620px; max-height: 92%; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: 24px 24px 0 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; animation: up .22s ease; overscroll-behavior: contain; }
.grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); justify-self: center; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
@keyframes fade { from { opacity: 0; } }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 700; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }
.toast.xp { background: var(--accent); color: var(--accent-ink); font-family: var(--display); font-size: 24px; text-transform: uppercase; letter-spacing: .03em; animation: pop .5s ease; }
@keyframes pop { 0% { transform: translate(-50%, 20px) scale(.8); opacity: 0; } 60% { transform: translate(-50%, -4px) scale(1.06); opacity: 1; } }
.banner { border-radius: 14px; padding: 12px 14px; background: var(--accent-soft); color: var(--fg); font-size: 15px; border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); }
.empty { padding: 18px; text-align: center; color: var(--muted); border: 1.5px dashed var(--line); border-radius: 14px; }
.note { padding: 12px 14px; border-radius: 14px; background: var(--surface-2); border-left: 4px solid var(--accent); }
.hero-word { font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: clamp(40px, 12vw, 64px); line-height: .9; letter-spacing: .01em; }
.hero-word em { font-style: normal; color: var(--accent); }
.hero-word s { color: var(--muted); text-decoration-color: var(--accent); text-decoration-thickness: 5px; }
.rules { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none; }
.rules li { display: flex; gap: 10px; align-items: flex-start; }
.num { width: 64px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

function patch(el, html) {
  if (el._html === html) return;
  const keep = {}, a = document.activeElement;
  const focus = a?.id && el.contains(a) ? { id: a.id, s: a.selectionStart, e: a.selectionEnd } : null;

}

async function shrink(file, max, quality) {
  let src, w, h;
  try { src = await createImageBitmap(file, { imageOrientation: "from-image" }); w = src.width; h = src.height; }
  catch { src = new Image(); src.src = URL.createObjectURL(file); await src.decode(); w = src.naturalWidth; h = src.naturalHeight; }
  const k = Math.min(1, max / Math.max(w, h)), c = document.createElement("canvas");
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, "image/jpeg", quality));
}
const toDataURL = b => new Promise((r, j) => { const f = new FileReader(); f.onload = () => r(f.result); f.onerror = j; f.readAsDataURL(b); });
async function saveLog() {
  const s = S.sheet, d = KINDS[s.kind];
  const note = (document.getElementById("lg-note")?.value || "").trim();
  const min = d.min ? Math.round(+document.getElementById("lg-min").value) : 0;
  if (d.min && !(min > 0)) return toast("Enter how many minutes.");
  if (note.length < 3) { document.getElementById("lg-note")?.focus(); return toast("Add a short note first. Say what you did."); }
  s.busy = true; renderSheet();
  const prev = s.edit ? S.days[s.date]?.logs?.find(x => x.id === s.edit) : null;
  if (s.edit && !prev) { S.sheet = null; renderSheet(); return toast("That entry was removed."); }
  const log = { id: prev?.id || rid(8), kind: s.kind, ts: prev?.ts || Date.now() };
  if (prev) log.edited = Date.now();
  if (min) log.min = min; if (note) log.note = note; if (s.type) log.type = s.type;
  try {
    if (s.file) {
      const pid = rid(12), proof = { kind: s.kind, date: s.date, ts: Date.now() };
      let u = await toDataURL(await shrink(s.file, 1080, .7));
      if (u.length > 700000) u = await toDataURL(await shrink(s.file, 720, .55));
      if (u.length > 700000) throw { code: "too_big" };
      proof.data = u;
      await S.db.doc(`people/${S.uid}/proofs/${pid}`).set(proof);
      log.proof = pid;
    } else if (s.oldProof && !s.dropOld) log.proof = s.oldProof;
    if (s.oldProof && log.proof !== s.oldProof) await S.db.doc(`people/${S.uid}/proofs/${s.oldProof}`).delete();
    const before = S.mine.lvl.n, ref = S.db.doc(`people/${S.uid}/days/${s.date}`), cur = S.days[s.date];
    const logs = prev ? cur.logs.map(x => x.id === prev.id ? log : x) : [...(cur?.logs || []), log];
    await (chain = chain.then(() => ref.set({ date: s.date, logs })));
    if (prev) { S.sheet = null; renderSheet(); if (s.url) URL.revokeObjectURL(s.url); return toast(log.proof && !prev.proof ? `Updated · +${PHOTO_XP} XP for the photo` : "Updated", log.proof && !prev.proof ? "xp" : ""); }
    const gain = d.xp + (log.proof ? PHOTO_XP : 0);
    S.sheet = null; renderSheet();
    if (s.url) URL.revokeObjectURL(s.url);
    setTimeout(() => { const after = computeMine().lvl; toast(after.n > before ? `Level up! Lv ${after.n} · ${after.name}` : `+${gain} XP`, "xp"); }, 250);
  } catch (e) {
    s.busy = false; renderSheet();
    if (e?.code === "too_big") toast("That photo is too large. Try another one.");
    else onWriteErr(e);
  }
}

  }
  if (kind === "onboard") {
    const name = document.getElementById("ob-name").value.trim(), side = document.querySelector("input[name=ob-side]:checked")?.value;
    if (!side) return toast("Pick the men's side or the women's side.");
    if (!name) return toast("Type your name.");
    const why = document.getElementById("ob-why").value.trim(), btn = f.querySelector("button[type=submit]");
    if (btn) { btn.disabled = true; btn.textContent = "Setting you up…"; }
    return q(async () => { await S.db.doc(`people/${S.uid}`).set({ name, why, side, groups: [], joined: Date.now(), stats: {}, seen: Date.now() }); toast(`Welcome, ${name}. Let's execute.`); })
      .finally(() => { if (btn?.isConnected) { btn.disabled = false; btn.textContent = "I'm in. Start executing."; } });
  }
  if (kind === "profile") {
    const name = document.getElementById("pf-name").value.trim() || S.profile.name, why = document.getElementById("pf-why").value.trim();
    const side = document.querySelector("input[name=pf-side]:checked")?.value || sideOf(S.profile);
    return q(async () => { await S.db.doc(`people/${S.uid}`).update({ name, why, side }); toast("Saved"); });
  }
  if (kind === "padd") {
    const pid = f.dataset.plan, inp = document.getElementById("pa-" + pid), text = inp.value.trim(); if (!text) return;
    const tin = document.getElementById("pt-" + pid), time = tin?.value || "";
    inp.value = ""; if (tin) tin.value = "";
    const items = [...(S.plans[pid]?.items || []), { id: rid(6), text, done: false, ...(time ? { time } : {}) }];
    q(() => S.db.doc(`people/${S.uid}/plans/${pid}`).set({ items }));
    if (time) { queueTodoSync(); if (!gtok() && S.profile?.gcal?.synced) toast("Added. It goes to Google next time you sync on the Calendar tab."); }
    return;
  }
  if (kind === "goal") {
    const inp = document.getElementById("goal-text"), text = inp.value.trim(); if (!text) return toast("Type your goal for this week.");
    const g = S.profile.goal, wk = monday(today()), same = g?.wk === wk;
    inp.value = ""; S.goalEdit = false;
    return q(async () => { await S.db.doc(`people/${S.uid}`).update({ goal: { wk, text, done: same && g.text === text ? !!g.done : false } }); toast("Goal set. Go get it."); });
  }
  if (kind === "wall") {
    const g = f.dataset.g, inp = document.getElementById("wall-text-" + g), text = inp.value.trim(); if (text.length < 3) return toast("Write a little more first.");
    const anon = document.getElementById("wall-anon-" + g).checked, kindP = S.wallKind || "prayer";
    inp.value = ""; document.getElementById("wall-anon-" + g).checked = false;
    return q(async () => { await S.db.doc(`groups/${g}/posts/${rid(12)}`).set({ by: S.uid, name: anon ? "" : S.profile.name || "", kind: kindP, text, anon, ts: Date.now(), amen: [] }); toast(kindP === "prayer" ? "Posted. The crew will pray with you." : "Posted"); });
  }
  if (kind === "feature") {
    const v = id => document.getElementById(id).value.trim(), url = v("ft-url");
    if (url && !safeUrl(url)) return toast("The link must start with https://");
    const at = v("ft-ann"), old = S.feature?.announce, announce = at ? { text: at, ts: old?.text === at ? old.ts : Date.now() } : null;
    return q(async () => { await S.db.doc("config/feature").set({ announce, podcast: { title: v("ft-title"), url, note: v("ft-note") }, prize: { text: v("ft-prize") }, updated: Date.now() }); toast("Saved. Everyone sees it now."); });
  }
  if (kind === "gnew") {
    const name = document.getElementById("g-name").value.trim(); if (!name) return;
    const gid = rid(10), code = rid(6).toUpperCase();
    return q(async () => {
      await S.db.doc(`groups/${gid}`).set({ name, code, by: S.uid, created: Date.now() });
      await S.db.doc(`people/${S.uid}`).update({ groups: [...(S.profile.groups || []), gid] });
      toast(`Crew created. Code: ${code}`);
    });
  }
  if (kind === "gjoin") {
    const code = document.getElementById("g-code").value.trim().toUpperCase();
    const hit = Object.entries(S.groups).find(([, g]) => g.code === code);
    if (!hit) return toast("No crew with that code. Check the 6 letters and try again.");
    if ((S.profile.groups || []).includes(hit[0])) return toast("You're already in that crew.");
    return q(async () => { await S.db.doc(`people/${S.uid}`).update({ groups: [...(S.profile.groups || []), hit[0]] }); toast(`You joined ${hit[1].name}`); crewLoaded = 0; loadCrewProofs(); });
  }
  if (kind === "coachpw") {
    if (!S.isOwner) return;
    if ((S.pwWait || 0) > Date.now()) return toast("Too many tries. Wait 30 seconds.");
    const ok = (await sha("eoe-coach:" + document.getElementById("cp-pass").value)) === COACH_HASH;
    if (!ok) { S.pwFails = (S.pwFails || 0) + 1; if (S.pwFails >= 5) { S.pwFails = 0; S.pwWait = Date.now() + 30000; } return toast("Wrong password."); }
    S.coachOK = true; S.pwFails = 0; try { sessionStorage.setItem("eoe-coach", COACH_HASH + S.uid); } catch {}
    return render();
  }
  if (kind === "routine") {
    const r = {};
    for (const k of Object.keys(DEF_ROUTINE)) {
      const days = [...Array(7)].map((_, i) => i).filter(i => document.getElementById(`rt-${k}-d${i}`).checked);
      r[k] = { on: document.getElementById(`rt-${k}-on`).checked, time: document.getElementById(`rt-${k}-time`).value || DEF_ROUTINE[k].time, dur: +document.getElementById(`rt-${k}-dur`).value, days };
    }
    return q(async () => { await S.db.doc(`people/${S.uid}`).update({ routine: r }); toast(S.profile?.gcal?.synced ? "Routine saved. Tap Sync again to update Google Calendar." : "Routine saved"); });
  }
  if (kind === "note") {
    const text = document.getElementById("n-text").value.trim(); if (!text || !S.sel) return;
    const id = S.sel;
    return q(async () => { await S.db.doc(`people/${id}/notes/${rid(10)}`).set({ text, ts: Date.now(), from: S.uid, seen: false }); toast("Sent"); loadPerson(id); });
  }
  if (kind === "rules") {
    const R = {}; for (const k of Object.keys(DEF_RULES)) { const v = Math.round(+document.getElementById("r-" + k).value); R[k] = Math.max(k.endsWith("Weeks") ? 1 : 0, Math.min(k.endsWith("Days") ? 7 : 14, isFinite(v) ? v : DEF_RULES[k])); }
    return q(async () => { await S.db.doc("config/rules").set(R); toast("Rules saved"); });
  }
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (views.includes(h) && h !== S.view) go(h); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.sheet) { S.sheet = null; renderSheet(); } });
document.addEventListener("visibilitychange", () => { if (!document.hidden) { beat(); render(); } });
setInterval(() => { beat(); if (S.profile) render(); }, 60000);
boot();
</script>
</body>
</html>
