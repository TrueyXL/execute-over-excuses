<style>
/* Layout: one phone-width column (wider on desktop), game HUD on top, fixed bottom tab bar, bottom sheets for logging. Dark-first "forge" look. */
:root {
  --bg: #0f1114; --surface: #171a1f; --surface-2: #1f232a; --line: #2b3038; --fg: #edeff2; --muted: #8c94a1;
  --accent: #f2a93b; --accent-ink: #1a1205; --accent-soft: rgba(242,169,59,.14);
  --spirit: #f2c14e; --build: #5aa9e6; --body: #ef6a4c; --stretch: #4fc3a1; --learn: #b08cf2;
  --good: #4fc38a; --bad: #e5534b; --shadow: 0 10px 30px rgba(0,0,0,.35);
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body-font: "Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #eceef1; --surface: #ffffff; --surface-2: #f4f5f7; --line: #d6dae0; --fg: #14171c; --muted: #5b6370;
  --accent: #b46f0c; --accent-ink: #ffffff; --accent-soft: rgba(180,111,12,.12);
  --spirit: #a97c06; --build: #1f6fb2; --body: #c6402a; --stretch: #17876a; --learn: #7246c9;
  --good: #1d8a54; --bad: #c4362f; --shadow: 0 10px 30px rgba(20,23,28,.10); color-scheme: light;
} }
:root[data-theme="light"] {
  --bg: #eceef1; --surface: #ffffff; --surface-2: #f4f5f7; --line: #d6dae0; --fg: #14171c; --muted: #5b6370;
  --accent: #b46f0c; --accent-ink: #ffffff; --accent-soft: rgba(180,111,12,.12);
  --spirit: #a97c06; --build: #1f6fb2; --body: #c6402a; --stretch: #17876a; --learn: #7246c9;
  --good: #1d8a54; --bad: #c4362f; --shadow: 0 10px 30px rgba(20,23,28,.10); color-scheme: light;
}
/* ===== Fresh skins (data-skin): glassy cards, soft glows, rounder shapes, a floating tab bar ===== */
:root[data-skin="midnight"] {
  --bg: #0a0b16; --surface: rgba(255,255,255,.055); --surface-2: rgba(255,255,255,.07); --line: rgba(255,255,255,.09); --fg: #f3f4fb; --muted: #969bb6;
  --accent: #8b7bff; --accent-2: #22d3ee; --accent-ink: #ffffff; --accent-soft: rgba(139,123,255,.18);
  --spirit: #fbbf24; --build: #60a5fa; --body: #fb7185; --stretch: #34d399; --learn: #c084fc; --good: #34d399; --bad: #f87171;
  --shadow: 0 20px 50px rgba(0,0,0,.45); --solid: #14152a;
  --glow: radial-gradient(60% 40% at 10% 0%, rgba(139,123,255,.28), transparent 70%), radial-gradient(50% 35% at 100% 20%, rgba(34,211,238,.18), transparent 70%), radial-gradient(60% 40% at 50% 100%, rgba(251,113,133,.12), transparent 70%);
  color-scheme: dark;
}
:root[data-skin="sunset"] {
  --bg: #fff5ef; --surface: rgba(255,255,255,.72); --surface-2: rgba(255,240,232,.85); --line: rgba(120,60,40,.12); --fg: #241626; --muted: #7c6774;
  --accent: #f0574a; --accent-2: #ff9f43; --accent-ink: #ffffff; --accent-soft: rgba(240,87,74,.12);
  --spirit: #c08400; --build: #2563eb; --body: #e0413a; --stretch: #0f9d76; --learn: #7c3aed; --good: #12925f; --bad: #d63a35;

  color-scheme: light;
}
/* v20 looks: Onyx (deep black, ember gold) and Daylight (clean bright white, electric blue) */
:root[data-skin="onyx"] {
  --bg: #060709; --surface: rgba(255,255,255,.045); --surface-2: rgba(255,255,255,.07); --line: rgba(255,255,255,.085); --fg: #f6f4ef; --muted: #a29e95;
  --accent: #ff8a3d; --accent-2: #ffc94d; --accent-ink: #1b0d02; --accent-soft: rgba(255,138,61,.15);
  --spirit: #ffc94d; --build: #5cb8ff; --body: #ff6b6b; --stretch: #3ddc97; --learn: #b794f6; --good: #3ddc97; --bad: #ff5d5d;
  --shadow: 0 20px 50px rgba(0,0,0,.55); --solid: #111216;
  --glow: radial-gradient(55% 35% at 0% 0%, rgba(255,138,61,.20), transparent 70%), radial-gradient(45% 30% at 100% 25%, rgba(255,201,77,.10), transparent 70%);
  color-scheme: dark;
}
:root[data-skin="daylight"] {
  --bg: #f4f6fb; --surface: rgba(255,255,255,.92); --surface-2: #edf1f8; --line: rgba(15,23,42,.10); --fg: #0f172a; --muted: #586174;
  --accent: #2563eb; --accent-2: #06b6d4; --accent-ink: #ffffff; --accent-soft: rgba(37,99,235,.10);
  --spirit: #b7791f; --build: #2563eb; --body: #e11d48; --stretch: #059669; --learn: #7c3aed; --good: #059669; --bad: #dc2626;
  --shadow: 0 12px 32px rgba(15,23,42,.08); --solid: #ffffff;
  --glow: radial-gradient(60% 35% at 0% 0%, rgba(37,99,235,.12), transparent 70%), radial-gradient(50% 30% at 100% 20%, rgba(6,182,212,.10), transparent 70%);
  color-scheme: light;
}
:root[data-skin="emerald"] {
  --bg: #04100c; --surface: rgba(255,255,255,.045); --surface-2: rgba(255,255,255,.07); --line: rgba(255,255,255,.085); --fg: #eefaf4; --muted: #92a89e;
  --accent: #2ee59d; --accent-2: #b4f34a; --accent-ink: #022014; --accent-soft: rgba(46,229,157,.15);
  --spirit: #fcd34d; --build: #60a5fa; --body: #fb7185; --stretch: #2ee59d; --learn: #c4b5fd; --good: #2ee59d; --bad: #ff6b6b;
  --shadow: 0 20px 50px rgba(0,0,0,.55); --solid: #0b1914;
  --glow: radial-gradient(55% 35% at 0% 0%, rgba(46,229,157,.20), transparent 70%), radial-gradient(45% 30% at 100% 25%, rgba(180,243,74,.10), transparent 70%);
  color-scheme: dark;
}
:root[data-skin="bloom"] {
  --bg: #fff7fb; --surface: rgba(255,255,255,.9); --surface-2: #fdeef6; --line: rgba(90,20,60,.10); --fg: #1f1027; --muted: #6f5a6a;
  --accent: #e8338f; --accent-2: #ff8a1f; --accent-ink: #ffffff; --accent-soft: rgba(232,51,143,.10);
  --spirit: #c27c00; --build: #2563eb; --body: #e11d48; --stretch: #059669; --learn: #8b3dff; --good: #059669; --bad: #dc2626;
  --shadow: 0 14px 34px rgba(150,30,90,.10); --solid: #ffffff;
  --glow: radial-gradient(60% 35% at 0% 0%, rgba(232,51,143,.16), transparent 70%), radial-gradient(50% 30% at 100% 20%, rgba(255,138,31,.16), transparent 70%);
  color-scheme: light;
}
:root[data-skin] { --display: "Sora", "Plus Jakarta Sans", system-ui, sans-serif; --body-font: "Plus Jakarta Sans", "Segoe UI", Roboto, sans-serif; }
:root[data-skin] body { background: var(--glow), var(--bg); background-attachment: fixed; }
:root[data-skin] h1, :root[data-skin] h2, :root[data-skin] h3, :root[data-skin] .logo { text-transform: none; letter-spacing: -.02em; }
:root[data-skin] h1 { font-size: 30px; font-weight: 800; line-height: 1.08; } :root[data-skin] h2 { font-size: 21px; font-weight: 700; line-height: 1.15; } :root[data-skin] h3 { font-size: 17px; font-weight: 700; line-height: 1.2; }
:root[data-skin] .card, :root[data-skin] .hud { border-radius: 26px; backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3); box-shadow: var(--shadow); }
:root[data-skin] .hud { background: linear-gradient(140deg, color-mix(in srgb, var(--accent) 22%, transparent), color-mix(in srgb, var(--accent-2) 10%, transparent) 60%, var(--surface)); }
:root[data-skin] .logo { font-weight: 800; font-size: 20px; }
:root[data-skin] .logo b { line-height: 1; padding: 0 2px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
:root[data-skin] .btn.primary, :root[data-skin] .seg button.on, :root[data-skin] .lvl, :root[data-skin] .pick label:has(input:checked) { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-ink); border-color: transparent; box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 35%, transparent); }
:root[data-skin] .btn, :root[data-skin] .input, :root[data-skin] .icon-btn { border-radius: 16px; }
:root[data-skin] .btn.sm { border-radius: 12px; }
:root[data-skin] .xpbar i { background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
:root[data-skin] .act { border-radius: 22px; background: var(--surface); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: var(--shadow); gap: 8px; }
:root[data-skin] .act > .ic { width: 46px; height: 46px; padding: 11px; border-radius: 16px; background: color-mix(in srgb, currentColor 16%, transparent); }
:root[data-skin] .must .badge, :root[data-skin] .quest { border-radius: 14px; }
:root[data-skin] .pip { border-radius: 99px; } :root[data-skin] .pip.on { box-shadow: 0 0 10px color-mix(in srgb, currentColor 55%, transparent); }
:root[data-skin] .nav { left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); border: 1px solid var(--line); border-radius: 26px; box-shadow: var(--shadow); background: color-mix(in srgb, var(--solid) 78%, transparent); padding: 4px; }
:root[data-skin] .nav a { border-radius: 20px; text-transform: none; letter-spacing: 0; font-weight: 600; }
:root[data-skin] .nav a.on { background: var(--accent-soft); color: var(--accent); }
:root[data-skin] .app { padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px)); }
:root[data-skin] .sheet { background: var(--solid); border-radius: 30px 30px 0 0; }
:root[data-skin] .scrim { background: rgba(5,5,15,.5); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
:root[data-skin] .chip.on, :root[data-skin] .streak { background: var(--accent-soft); }
:root[data-skin] .bub.me { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
:root[data-skin] .ytthumb { border-radius: 18px; }
:root[data-skin] .sermon { background: linear-gradient(160deg, color-mix(in srgb, var(--spirit) 14%, transparent), var(--surface) 55%); }
/* Look picker */
.looks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.look { display: grid; gap: 4px; justify-items: start; text-align: left; padding: 10px; border-radius: 18px; border: 1.5px solid var(--line); background: var(--surface-2); font: inherit; color: inherit; cursor: pointer; }
.look.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.look .sw { width: 100%; height: 54px; border-radius: 12px; display: flex; align-items: flex-end; gap: 6px; padding: 8px; border: 1px solid rgba(128,128,128,.25); }
.look .sw i { display: block; height: 14px; border-radius: 99px; flex: 1; } .look .sw i + i { flex: .35; }
.look b { font-size: 15px; } .look small { font-size: 12px; color: var(--muted); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
img { max-width: 100%; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--fg); font: 16px/1.5 var(--body-font); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, textarea, select { font: inherit; color: inherit; }
input, textarea, select { font-size: 16px; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 620px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.app.wide { max-width: 1040px; }
h1, h2, h3 { font-family: var(--display); text-transform: uppercase; letter-spacing: .02em; line-height: 1; margin: 0; text-wrap: balance; }
h1 { font-size: 34px; font-weight: 900; }
h2 { font-size: 22px; font-weight: 800; }
h3 { font-size: 18px; font-weight: 800; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.tiny { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.spread { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.stack { display: grid; gap: 8px; }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Brand bar */
.brand { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.logo { font-family: var(--display); font-weight: 900; font-size: 22px; text-transform: uppercase; letter-spacing: .03em; display: flex; align-items: center; gap: 6px; }
.logo b { color: var(--accent); font-size: 26px; line-height: 0; }
.logo s { text-decoration: line-through; text-decoration-thickness: 3px; text-decoration-color: var(--accent); color: var(--muted); }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; width: 44px; height: 44px; display: grid; place-items: center; }

/* HUD */
.hud { background: linear-gradient(160deg, var(--surface-2), var(--surface)); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: grid; gap: 14px; position: relative; overflow: hidden; }
.hud::after { content: ""; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, var(--accent-soft), transparent 70%); pointer-events: none; }
.lvl { width: 58px; height: 58px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 30px; flex: none; transform: rotate(-4deg); box-shadow: 0 6px 18px var(--accent-soft); }
.xpbar { height: 12px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--spirit)); border-radius: 99px; transition: width .6s ease; }
.streak { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 14px; white-space: nowrap; }

/* Quests */
.quest { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
.quest.done { border-color: color-mix(in srgb, var(--good) 55%, var(--line)); }
.check { width: 30px; height: 30px; border-radius: 10px; border: 2px solid var(--line); display: grid; place-items: center; flex: none; }
.quest.done .check { background: var(--good); border-color: var(--good); color: var(--bg); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 99px; font-size: 13px; font-weight: 600; background: var(--surface); border: 1px solid var(--line); white-space: nowrap; }
.chip.on { border-color: transparent; background: var(--accent-soft); color: var(--accent); }
.ring { width: 64px; height: 64px; flex: none; }
.ring circle { fill: none; stroke-width: 7; }
.ring .bg { stroke: var(--surface-2); }
.ring .fg { stroke: var(--good); stroke-linecap: round; transition: stroke-dashoffset .6s ease; transform: rotate(-90deg); transform-origin: 50% 50%; }
.ring text { fill: var(--fg); font-family: var(--display); font-weight: 900; font-size: 20px; text-anchor: middle; dominant-baseline: central; }

/* Action pad */
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.act { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px 8px 12px; display: grid; justify-items: center; gap: 6px; font-weight: 700; font-size: 15px; min-height: 92px; position: relative; transition: transform .12s ease; }
.act:active { transform: scale(.96); }
.act .ic { width: 28px; height: 28px; }
.act small { font-family: var(--mono); font-size: 11px; color: var(--muted); font-weight: 500; }
.a-spirit { color: var(--spirit); } .a-build { color: var(--build); } .a-body { color: var(--body); } .a-stretch { color: var(--stretch); } .a-learn { color: var(--learn); }
.act span { color: var(--fg); }

/* Weekly musts */
.must { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; }
.must .badge { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); }
.pips { display: flex; gap: 4px; flex-wrap: wrap; }
.pip { width: 16px; height: 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); }
.pip.on { background: currentColor; border-color: transparent; }
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { text-align: center; display: grid; gap: 4px; justify-items: center; font-size: 12px; color: var(--muted); font-weight: 600; }
.dots { display: flex; gap: 3px; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--line); }
.dot.s { background: var(--spirit); border-color: var(--spirit); }
.dot.b { background: var(--build); border-color: var(--build); }
.dot.miss { border-color: var(--bad); }
.day.today { color: var(--accent); }
.status { padding: 4px 10px; border-radius: 99px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.status.good { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.status.warn { background: var(--accent-soft); color: var(--accent); }
.status.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }

/* Lists */
.list { display: grid; }
.item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); min-width: 0; }
.item:first-child { border-top: 0; padding-top: 2px; }
.item .ic { margin-top: 2px; }
.thumb { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; flex: none; background: var(--surface-2); border: 1px solid var(--line); }
.playbadge { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 34px; height: 34px; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; display: grid; place-items: center; pointer-events: none; }
.playbadge .ic { width: 16px; height: 16px; fill: currentColor; margin-left: 2px; }
.shot .playbadge { width: 46px; height: 46px; top: 40%; } .shot .playbadge .ic { width: 22px; height: 22px; }
button.thumbbtn { position: relative; padding: 0; border: 0; background: none; flex: none; border-radius: 12px; cursor: zoom-in; }
img.thumb, .shot img, .ytthumb { animation: imgin .35s ease both; }
@keyframes imgin { from { opacity: 0; } to { opacity: 1; } }
.bigphoto { width: 100%; max-height: 74vh; object-fit: contain; border-radius: 14px; background: #000; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 11px 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
a.btn { text-decoration: none; color: inherit; }
a.btn.primary { color: var(--accent-ink); }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.linkish { background: none; border: 0; padding: 4px; color: var(--muted); font-size: 14px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 14px; font-weight: 600; color: var(--muted); }
.input { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 48px; }
textarea.input { min-height: 84px; resize: vertical; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }

.avatar { position: relative; }

@keyframes burst { 0% { opacity: 0; transform: scale(.4); } 20% { opacity: 1; transform: scale(1.15); } 60% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }

/* Nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }

/* Sheet */

.banner { border-radius: 14px; padding: 12px 14px; background: var(--accent-soft); color: var(--fg); font-size: 15px; border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); }

/* ===== day streak: days in a row with time with God. One grace day every 2 weeks covers a missed day. ===== */
const GRACE_EPOCH = "2026-01-05", GRACE_MANUAL = "2026-11-23";  // before GRACE_MANUAL grace was automatic; from then on you tap "Use grace day"
const myGraces = () => S.profile?.graces || [];  // grace periods are fixed 2-week blocks starting on this Monday
const graceBlock = d => Math.floor(Math.round((parse(d) - parse(GRACE_EPOCH)) / 864e5) / 14);
const blockStart = b => addD(GRACE_EPOCH, b * 14);
function dayStreak(days, t, graces = []) {
  const has = d => hasArea(days[d], "spirit"), G = new Set(graces), first = [...Object.keys(days).filter(has), ...graces].sort()[0];
  const nextGrace = blockStart(graceBlock(t) + 1);
  if (!first) return { n: 0, today: false, graceToday: false, grace: true, used: [], best: 0, nextGrace };
  const usedBlocks = new Set(); let n = 0, best = 0, used = [];
  for (let d = first; d < t; d = addD(d, 1)) {
    if (has(d)) { n++; best = Math.max(best, n); continue; }
    const b = graceBlock(d), ok = d < GRACE_MANUAL ? n > 0 : G.has(d);
    if (ok && !usedBlocks.has(b)) { usedBlocks.add(b); used.push(d); continue; }   // grace keeps the streak alive (doesn't add a day)
    n = 0;
  }
  const done = has(t); if (done) { n++; best = Math.max(best, n); }
  const graceToday = !done && G.has(t) && !usedBlocks.has(graceBlock(t)); if (graceToday) { usedBlocks.add(graceBlock(t)); used.push(t); }
  return { n, today: done, graceToday, grace: !usedBlocks.has(graceBlock(t)), used, best, nextGrace };
}

/* Chapter text comes from bolls.life (free, open). Cached per version + chapter. */
const RDC = {};

/* bolls.life turns away bursts of requests (429), so: one request at a time, the chapter on screen first,
   a few retries with a pause, chapters kept on the phone (last 150), and a failed chapter tries again later. */
const CHQ = { list: [], busy: false };
const chStore = { get(k) { try { const x = localStorage.getItem("eoe-ch:" + k); return x ? JSON.parse(x) : null; } catch { return null; } },
  put(k, vs) { try { const idx = JSON.parse(localStorage.getItem("eoe-ch-idx") || "[]").filter(x => x !== k); idx.push(k);
    while (idx.length > 150) localStorage.removeItem("eoe-ch:" + idx.shift());

      const r = await fetch(`https://bolls.life/get-chapter/${v}/${b}/${c}/`, { signal: ctl.signal }); clearTimeout(t);
      if (r.status === 429 || r.status >= 500) continue;
      if (!r.ok) return null;
      const a = await r.json(), vs = (Array.isArray(a) ? a : []).map(x => ({ n: +x.verse, t: cleanVerse(x.text) })).filter(x => x.n && x.t);
      if (vs.length && /has prohibited me from using/.test(vs[0].t)) return null;

async function chPump() {
  if (CHQ.busy) return; CHQ.busy = true;

    if (RDC[k]?.st === "ok") continue;

    if (vs) chStore.put(k, vs);

/* Section headings + words of Jesus, from the Berean Standard Bible (public domain, bible.helloao.org).

    const hd = {}, wj = {}; let pend = [];
    for (const x of d?.chapter?.content || []) {
      if (x.type === "heading") pend.push((x.content || []).filter(t => typeof t === "string").join(" ").trim());
      else if (x.type === "verse") {
        if (pend.length) { hd[x.number] = pend.filter(Boolean); pend = []; }
        const segs = (x.content || []).map(t => typeof t === "string" ? { t, j: false } : t && typeof t.text === "string" ? { t: t.text, j: !!t.wordsOfJesus } : null).filter(Boolean);

async function importGcal() {

let pulseKey = "";
function sendPulse() {
  if (!PUSH_URL || !S.mine || !S.profile || S.ro) return;
  const w = S.mine.thisW, mon = w.mon, mins = Object.values(S.days).filter(d => d.date >= mon).flatMap(d => d.logs || []).filter(l => l.kind !== "heal");
  const gj = Object.values(S.cheers).flat().filter(c => c.t === "gj" && c.to === S.uid && c.by !== S.uid && c.ts >= parse(mon).getTime()).length;
  const mp = myPartners();
  const body = { wk: mon, name: S.profile.name || "", last: S.mine.last || "", logs: mins.length, min: mins.reduce((a, l) => a + (+l.min || 0), 0), musts: w.mustsDone, consistent: w.consistent, gj, streak: S.mine.ds.n, groups: (S.profile.groups || []).slice(0, 5), partners: mp?.ids || [] };
  const key = stable(body); let saved = ""; try { saved = localStorage.getItem("eoe-pulse-" + S.uid) || ""; } catch {}
  if (key === pulseKey || key === saved) return; pulseKey = key;
  pushCall("/pulse", body).then(r => { if (r) try { localStorage.setItem("eoe-pulse-" + S.uid, key); } catch {} });
}

    if ((S.profile.groups || []).includes(hit[0])) return toast("You're already in that crew.");
    return q(async () => { await S.db.doc(`people/${S.uid}`).update({ groups: [...(S.profile.groups || []), hit[0]] }); toast(`You joined ${hit[1].name}`); crewLoaded = 0; loadCrewProofs(); });
  }
  if (kind === "coachpw") {
    if (!S.isOwner) return;
    if ((S.pwWait || 0) > Date.now()) return toast("Too many tries. Wait 30 seconds.");
    const ok = (await sha("eoe-coach:" + document.getElementById("cp-pass").value)) === COACH_HASH;
    if (!ok) { S.pwFails = (S.pwFails || 0) + 1; if (S.pwFails >= 5) { S.pwFails = 0; S.pwWait = Date.now() + 30000; } return toast("Wrong password."); }
    S.coachOK = true; S.pwFails = 0; try { sessionStorage.setItem("eoe-coach", COACH_HASH + S.uid); } catch {}
    return render();
  }
  if (kind === "routine") {
    const r = {};
    for (const k of Object.keys(DEF_ROUTINE)) {
      const days = [...Array(7)].map((_, i) => i).filter(i => document.getElementById(`rt-${k}-d${i}`).checked);
      r[k] = { on: document.getElementById(`rt-${k}-on`).checked, time: document.getElementById(`rt-${k}-time`).value || DEF_ROUTINE[k].time, dur: +document.getElementById(`rt-${k}-dur`).value, days };
    }
    return q(async () => { await S.db.doc(`people/${S.uid}`).update({ routine: r }); toast(S.profile?.gcal?.synced ? "Routine saved. Tap Sync again to update Google Calendar." : "Routine saved"); });
  }
  if (kind === "note") {
    const text = document.getElementById("n-text").value.trim(); if (!text || !S.sel) return;
    const id = S.sel;
    return q(async () => { await S.db.doc(`people/${id}/notes/${rid(10)}`).set({ text, ts: Date.now(), from: S.uid, seen: false }); toast("Sent"); loadPerson(id); });
  }
  if (kind === "rules") {
    const R = {}; for (const k of Object.keys(DEF_RULES)) { const v = Math.round(+document.getElementById("r-" + k).value); R[k] = Math.max(k.endsWith("Weeks") ? 1 : 0, Math.min(k.endsWith("Days") ? 7 : 14, isFinite(v) ? v : DEF_RULES[k])); }
    return q(async () => { await S.db.doc("config/rules").set(R); toast("Rules saved"); });
  }
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (views.includes(h) && h !== S.view) go(h); else if (readDeep(h)) openDeep(); });
/* Links from notifications: #chat-<crew id> opens that crew's chat, #dm-<person id> opens your private chat with them. */
function readDeep(h) {
  const m = /^(chat|dm)-([A-Za-z0-9_-]{1,64})$/.exec(h || ""); if (!m) return false;
  S.deep = { kind: m[1], id: m[2] }; S.view = "crew"; return true;
}
function openDeep() {
  const d = S.deep; if (!d || !S.profile) return;
  S.deep = null;
  try { history.replaceState(null, "", "#crew"); } catch {}
  if (d.kind === "chat" && (S.profile.groups || []).includes(d.id)) {
    S.gtab[d.id] = "chat"; go("crew");
    return setTimeout(() => { document.getElementById("crew-" + d.id)?.scrollIntoView({ block: "start" }); document.getElementById("gc-" + d.id)?.focus({ preventScroll: true }); }, 80);
  }
  if (d.kind === "dm") { go("crew"); S.sheet = { dm: d.id }; renderSheet(); return setTimeout(() => document.getElementById("dm-input")?.focus({ preventScroll: true }), 80); }
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.tour != null) return endTour(); if (e.key === "Escape" && S.sheet) { S.sheet = null; renderSheet(); } });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "bq") { const r = parseRef(e.target.value); if (r?.[1]) { e.preventDefault(); S.sheet = null; renderSheet(); S.bq = ""; openBible(r[0], r[1], r[2]); } } });
document.addEventListener("visibilitychange", () => { if (!document.hidden) { beat(); render(); } });
setInterval(() => { beat(); if (S.profile) render(); }, 60000);
boot();
</script>
